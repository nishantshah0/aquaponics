<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4fbf7"/><stop offset="1" stop-color="#eaf6f0"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1D9E75" stop-opacity="0.28"/><stop offset="1" stop-color="#1D9E75" stop-opacity="0"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#0F6E56" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="960" height="380" fill="url(#bg)"/>

  <!-- header -->
  <g filter="url(#sh)">
    <rect x="28" y="26" width="904" height="64" rx="14" fill="#ffffff" stroke="#d0ead9"/>
  </g>
  <rect x="44" y="42" width="32" height="32" rx="8" fill="#1D9E75"/>
  <text x="60" y="63" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">AC</text>
  <text x="90" y="52" fill="#0F6E56" font-size="19" font-weight="700">AquaControl</text>
  <text x="90" y="72" fill="#6b7280" font-size="12.5">Real-time aquaponics monitoring · USB · Wi-Fi/MQTT · Server</text>
  <g>
    <rect x="780" y="44" width="138" height="28" rx="14" fill="#E1F5EE" stroke="#9FE1CB"/>
    <circle cx="800" cy="58" r="4" fill="#1D9E75"/>
    <text x="812" y="62" fill="#0F6E56" font-size="12.5" font-weight="600">Live · Hardware</text>
  </g>

  <!-- sensor cards -->
  <g filter="url(#sh)">
    <g>
      <rect x="28" y="108" width="218" height="118" rx="14" fill="#fff" stroke="#d0ead9"/>
      <rect x="28" y="108" width="218" height="4" rx="2" fill="#1D9E75"/>
      <text x="46" y="136" fill="#6b7280" font-size="11" font-weight="700" letter-spacing="1">PH LEVEL</text>
      <text x="46" y="170" fill="#1a1a1a" font-size="34" font-weight="700">7.2</text>
      <text x="46" y="190" fill="#9ca3af" font-size="11.5">Target 6.5 – 8.5</text>
      <polyline points="46,214 70,210 94,212 118,206 142,209 166,203 190,207 214,204 230,206" fill="none" stroke="#1D9E75" stroke-width="1.6"/>
    </g>
    <g>
      <rect x="258" y="108" width="218" height="118" rx="14" fill="#fff" stroke="#d0ead9"/>
      <rect x="258" y="108" width="218" height="4" rx="2" fill="#1D9E75"/>
      <text x="276" y="136" fill="#6b7280" font-size="11" font-weight="700" letter-spacing="1">WATER TEMP</text>
      <text x="276" y="170" fill="#1a1a1a" font-size="34" font-weight="700">24.1<tspan font-size="14" fill="#6b7280"> °C</tspan></text>
      <text x="276" y="190" fill="#9ca3af" font-size="11.5">Target below 40 °C</text>
      <polyline points="276,210 300,206 324,212 348,205 372,200 396,208 420,203 444,210 460,205" fill="none" stroke="#1D9E75" stroke-width="1.6"/>
    </g>
    <g>
      <rect x="488" y="108" width="218" height="118" rx="14" fill="#fff" stroke="#d0ead9"/>
      <rect x="488" y="108" width="218" height="4" rx="2" fill="#1D9E75"/>
      <text x="506" y="136" fill="#6b7280" font-size="11" font-weight="700" letter-spacing="1">WATER LEVEL</text>
      <text x="506" y="170" fill="#1a1a1a" font-size="34" font-weight="700">1048<tspan font-size="14" fill="#6b7280"> L</tspan></text>
      <text x="506" y="190" fill="#9ca3af" font-size="11.5">Tank 1,061.9 L</text>
      <polyline points="506,206 530,208 554,205 578,209 602,206 626,210 650,207 674,209 690,206" fill="none" stroke="#1D9E75" stroke-width="1.6"/>
    </g>
    <g>
      <rect x="718" y="108" width="214" height="118" rx="14" fill="#fff8f8" stroke="#fca5a5"/>
      <rect x="718" y="108" width="214" height="4" rx="2" fill="#E24B4A"/>
      <text x="736" y="136" fill="#6b7280" font-size="11" font-weight="700" letter-spacing="1">TAN — AMMONIA</text>
      <text x="736" y="170" fill="#991b1b" font-size="34" font-weight="700">11.4<tspan font-size="14" fill="#6b7280"> g/d</tspan></text>
      <text x="736" y="190" fill="#9ca3af" font-size="11.5">Bio-filter limit 10.8 g/d</text>
      <polyline points="736,212 760,208 784,210 808,205 832,202 856,200 880,201 904,199 920,198" fill="none" stroke="#E24B4A" stroke-width="1.6"/>
    </g>
  </g>

  <!-- trend chart -->
  <g filter="url(#sh)">
    <rect x="28" y="244" width="600" height="112" rx="14" fill="#fff" stroke="#d0ead9"/>
  </g>
  <text x="46" y="270" fill="#0F6E56" font-size="13" font-weight="700">pH trend · 24 h (persisted history)</text>
  <rect x="46" y="282" width="560" height="58" fill="url(#spark)"/>
  <polyline fill="none" stroke="#1D9E75" stroke-width="2"
    points="46,316 86,312 126,320 166,308 206,314 246,300 286,322 326,310 366,318 406,304 446,316 486,308 526,320 566,306 606,314"/>
  <line x1="46" y1="298" x2="606" y2="298" stroke="#eef2f0"/>
  <line x1="46" y1="340" x2="606" y2="340" stroke="#eef2f0"/>

  <!-- data sources panel -->
  <g filter="url(#sh)">
    <rect x="644" y="244" width="288" height="112" rx="14" fill="#fff" stroke="#d0ead9"/>
  </g>
  <text x="662" y="270" fill="#0F6E56" font-size="13" font-weight="700">Data sources</text>
  <g font-size="12" fill="#374151">
    <circle cx="668" cy="290" r="4" fill="#0F6E56"/><text x="680" y="294">Server — live + persisted history</text>
    <circle cx="668" cy="310" r="4" fill="#2563eb"/><text x="680" y="314">USB — ESP32 over Web Serial</text>
    <circle cx="668" cy="330" r="4" fill="#7c3aed"/><text x="680" y="334">Wi-Fi — MQTT, or HTTP to backend</text>
  </g>
</svg>
